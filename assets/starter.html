<!doctype html><meta charset="utf-8"><title>Canvas GLSL starter</title>
<style>body{margin:0;background:#101823;color:white;font:16px sans-serif}canvas{display:block;width:100%;height:auto}p{padding:1rem}</style>
<canvas id="art" width="1920" height="1080"></canvas><p id="status"></p><label>Render mode <select id="render-mode"><option value="fast">Fast: 640×360, 6 fps</option><option value="full">Full: 1920×1080, 24 fps</option></select></label>
<script>
'use strict';
const art=document.getElementById('art'),W=1920,H=1080;
const modes={fast:{width:640,height:360,fps:6},full:{width:1920,height:1080,fps:24}};
let mode='fast',output=modes.fast,lastTime=0;
art.width=output.width;art.height=output.height;
function layer(name){const canvas=document.createElement('canvas');canvas.width=output.width;canvas.height=output.height;const ctx=canvas.getContext('2d');ctx.scale(output.width/W,output.height/H);return {name,canvas,ctx}}
const layers=[layer('environment'),layer('subject'),layer('emission')];
const scene=layer('composite');
function drawLayers(t){
 const [bg,subject,emission]=layers;for(const l of layers)l.ctx.clearRect(0,0,W,H);
 let c=bg.ctx,g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#102e54');g.addColorStop(1,'#ba826b');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.fillStyle='#172638';c.beginPath();c.moveTo(0,H);c.lineTo(0,800);c.bezierCurveTo(500,500,1200,1050,W,650);c.lineTo(W,H);c.fill();
 // Replace demonstration orb with an authored, named character rig.
 c=subject.ctx;const x=960+160*Math.sin(t*.8),y=520+35*Math.sin(t*1.6);
 g=c.createRadialGradient(x-35,y-35,5,x,y,110);g.addColorStop(0,'#fff4ba');g.addColorStop(.5,'#dda949');g.addColorStop(1,'#9c583d');c.fillStyle=g;c.beginPath();c.arc(x,y,110,0,Math.PI*2);c.fill();
 c=emission.ctx;g=c.createRadialGradient(x,y,60,x,y,200);g.addColorStop(0,'rgba(255,190,80,.3)');g.addColorStop(1,'rgba(255,190,80,0)');c.fillStyle=g;c.fillRect(x-200,y-200,400,400);
 scene.ctx.clearRect(0,0,W,H);for(const l of layers)scene.ctx.drawImage(l.canvas,0,0,W,H);
}
const VERTEX=`attribute vec2 a_position; varying vec2 v_uv; void main(){v_uv=a_position*.5+.5;gl_Position=vec4(a_position,0.,1.);}`;
const FRAGMENT=`precision highp float; varying vec2 v_uv; uniform sampler2D u_scene; uniform float u_strength; uniform float u_time; void main(){vec3 c=texture2D(u_scene,v_uv).rgb;float light=exp(-6.*length(v_uv-vec2(.7,.8)));c+=u_strength*light*vec3(.15,.08,.02)*(1.+.05*sin(u_time));gl_FragColor=vec4(c,1.);}`;
const gl=art.getContext('webgl',{preserveDrawingBuffer:true,alpha:false});
let program,texture;
if(gl){
 function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
 program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VERTEX));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FRAGMENT));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let a=gl.getAttribLocation(program,'a_position');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
 texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);for(const key of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,key,gl.LINEAR);for(const key of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,key,gl.CLAMP_TO_EDGE);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.uniform1i(gl.getUniformLocation(program,'u_scene'),0);
}
window.renderAt=function(t,strength=1){lastTime=t;drawLayers(t);if(gl){gl.viewport(0,0,output.width,output.height);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scene.canvas);gl.uniform1f(gl.getUniformLocation(program,'u_time'),t);gl.uniform1f(gl.getUniformLocation(program,'u_strength'),strength);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);if(gl.getError()!==gl.NO_ERROR)throw Error('WebGL render error')}else{art.getContext('2d').drawImage(scene.canvas,0,0)}};
window.artInfo={...output,mode,logicalWidth:W,logicalHeight:H,glsl:!!gl,layers:layers.map(l=>l.name)};
window.setRenderMode=function(next){
 if(!modes[next])throw Error('Unknown render mode: '+next);
 mode=next;output=modes[next];art.width=output.width;art.height=output.height;
 for(const l of [...layers,scene]){l.canvas.width=output.width;l.canvas.height=output.height;l.ctx.setTransform(output.width/W,0,0,output.height/H,0,0)}
 Object.assign(window.artInfo,output,{mode});document.getElementById('render-mode').value=mode;window.renderAt(lastTime);return window.artInfo;
};
document.getElementById('render-mode').addEventListener('change',event=>window.setRenderMode(event.target.value));
window.setRenderMode(new URLSearchParams(location.search).get('mode')||'fast');
document.getElementById('status').textContent=gl?'Canvas 2D + compiled GLSL. Use renderAt(seconds) for deterministic frames.':'Canvas fallback: GLSL unavailable.';
window.renderAt(0);
</script>
